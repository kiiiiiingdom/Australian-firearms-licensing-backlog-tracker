h="1"/><text x="547" y="231" fill="#1A344A" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">NSW   /   Firearms Registry</text><text x="547" y="266" fill="#66788A" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">As at 26 Mar 2026</text><text x="549" y="374" fill="#3367A6" font-size="99" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="start">84</text><text x="690" y="371" fill="#1A344A" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">PERMANENT</text><text x="690" y="398" fill="#1A344A" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">POSITIONS</text><line x1="547" y1="422" x2="933" y2="422" stroke="#DFE8EE" stroke-width="1"/><text x="548" y="464" fill="#254358" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">1 recorded vacancy</text><text x="548" y="505" fill="#B16A25" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">+22 additional positions announced</text><text x="548" y="533" fill="#66788A" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Announcement: 18 Jun 2026</text><text x="548" y="597" fill="#66788A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Positions / planned hires ≠ filled headcount</text><rect x="994" y="188" width="438" height="454" rx="18" fill="#FFFFFF" stroke="#DFE8EE" stroke-width="1"/><text x="1020" y="231" fill="#1A344A" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">SA   /   Registry &amp; Adjudication</text><text x="1020" y="266" fill="#66788A" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">FOI disclosure: 14 Apr 2026</text><text x="1020" y="381" fill="#0E8A84" font-size="91" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="start">17.8</text><text x="1269" y="370" fill="#1A344A" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">FTE</text><text x="1021" y="425" fill="#254358" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">SUBSTANTIVE POSITIONS</text><line x1="1020" y1="452" x2="1406" y2="452" stroke="#DFE8EE" stroke-width="1"/><text x="1021" y="492" fill="#254358" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">Temporary staff also mentioned</text><text x="1021" y="522" fill="#254358" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">but not numerically specified.</text><text x="1021" y="593" fill="#66788A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">17.8 is not a confirmed total workforce</text><rect x="48" y="674" width="672" height="210" rx="18" fill="#FFFFFF" stroke="#DFE8EE" stroke-width="1"/><text x="76" y="721" fill="#1A344A" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">WA   /   ICT INVESTMENT (NOT STAFF)</text><text x="76" y="753" fill="#66788A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">Firearms Licensing &amp; Registry System · 16 Jun 2025</text><text x="76" y="803" fill="#3367A6" font-size="33" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="start">AUD 35.12m</text><text x="350" y="803" fill="#254358" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">estimated cost</text><text x="76" y="851" fill="#B16A25" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">AUD 24.78m approved funding · 29% unfunded</text><rect x="747" y="674" width="685" height="210" rx="18" fill="#FFFFFF" stroke="#DFE8EE" stroke-width="1"/><text x="775" y="721" fill="#1A344A" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">NO VERIFIED MATCHING NUMERIC STAFFING</text><text x="775" y="751" fill="#66788A" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">in the currently tracked official extracts:</text><rect x="780" y="784" width="142" height="62" rx="13" fill="#EDF1F6" stroke="#EDF1F6" stroke-width="0"/><text x="851" y="821" fill="#697788" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">ACT</text><rect x="938" y="784" width="142" height="62" rx="13" fill="#EDF1F6" stroke="#EDF1F6" stroke-width="0"/><text x="1009" y="821" fill="#697788" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">NT</text><rect x="1096" y="784" width="142" height="62" rx="13" fill="#EDF1F6" stroke="#EDF1F6" stroke-width="0"/><text x="1167" y="821" fill="#697788" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">TAS</text><rect x="1254" y="784" width="142" height="62" rx="13" fill="#EDF1F6" stroke="#EDF1F6" stroke-width="0"/><text x="1325" y="821" fill="#697788" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="middle">VIC</text><text x="50" y="933" fill="#1A344A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">SOURCES: verified data/staffing.csv rows  •  FTE ≠ positions ≠ headcount ≠ recruitment ≠ ICT funding</text><text x="50" y="964" fill="#66788A" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">Snapshot covers official evidence available in this repository, not a census of all on-duty licensing personnel.</text></svg>
