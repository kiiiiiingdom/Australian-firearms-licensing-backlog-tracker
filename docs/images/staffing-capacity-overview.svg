<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="996" viewBox="0 0 1480 996" role="img" aria-label="Official Australian firearms licensing staffing and capacity disclosures"><title>Official Australian firearms licensing staffing and capacity disclosures</title><desc>QLD headcount components, NSW permanent positions and announced recruitment, SA substantive FTE, WA ICT funding. Different measures, not directly comparable.</desc><rect x="0" y="0" width="1480" height="996" rx="0" fill="#F5F8FB" stroke="#F5F8FB" stroke-width="0"/><rect x="48" y="36" width="6" height="72" rx="3" fill="#0E8A84" stroke="#0E8A84" stroke-width="0"/><text x="72" y="72" fill="#1A344A" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="800" text-anchor="start">OFFICIAL STAFFING &amp; CAPACITY DISCLOSURES</text><text x="72" y="106" fill="#66788A" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">官方披露的编制、人数与系统投入 · 不是当前实际在岗警员人数排名</text><rect x="1118" y="46" width="314" height="30" rx="15" fill="#FFF0DE" stroke="#FFF0DE" stroke-width="0"/><text x="1275" y="67" fill="#B16A25" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">NON-COMPARABLE</text><text x="50" y="158" fill="#66788A" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="500" text-anchor="start">Different source dates and measurement units; do not add or compare these figures as if all were employed officers.</text><rect x="48" y="188" width="438" height="454" rx="18" fill="#FFFFFF" stroke="#DFE8EE" stroke-width="1"/><text x="74" y="231" fill="#1A344A" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">QLD   /   Weapons Licensing Group</text><text x="74" y="266" fill="#66788A" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" text-anchor="start">As at 31 May 2025 · headcount components</text><text x="75" y="310" fill="#254358" font-size="1