name: Validate public observations
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate CSV schema, dates, arithmetic and source paths
        run: python3 scripts/validate_contributions.py
      - name: Verify README dashboard SVGs match the committed CSV data
        run: node scripts/generate_readme_visuals.mjs --check
      - name: Validate interactive national benchmark source figures
        run: node scripts/check_dashboard_data.mjs
      - name: Verify all eight generated state pages and national visualizations
        run: node scripts/generate_site.mjs --check
      - name: Validate official-source provenance and rights registry coverage
        run: python3 scripts/check_source_provenance.py
      - name: Install MkDocs Material
        run: python3 -m pip install -r requirements-docs.txt
      - name: Validate bilingual documentation site build (not deployed)
        run: mkdocs build --clean --strict
