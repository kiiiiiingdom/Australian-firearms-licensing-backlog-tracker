name: Validate public observations
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate CSV schema, dates, arithmetic and source paths
        run: python3 scripts/validate_contributions.py
