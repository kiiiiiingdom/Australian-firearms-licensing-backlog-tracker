name: Publish documented site (manual; public repositories only)
on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'I have completed privacy/history/licensing review and explicitly authorise publishing the site'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: github.event.inputs.confirm_publication == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish_ok: ${{ steps.visibility.outputs.public }}
    steps:
      - name: Check repository is public (never deploy private preview)
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api repos/${{ github.repository }} --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "The repository is private. Publishing is disabled." >&2
            exit 1
          fi
          echo "public=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: verify
    if: needs.verify.outputs.publish_ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Install MkDocs
        run: python3 -m pip install -r requirements-docs.txt
      - name: Verify source and build static website
        run: |
          python3 scripts/validate_contributions.py
          node scripts/generate_readme_visuals.mjs --check
          node scripts/check_dashboard_data.mjs
          node scripts/generate_site.mjs --check
          mkdocs build --strict --clean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
